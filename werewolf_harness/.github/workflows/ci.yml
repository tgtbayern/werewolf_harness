# Works whether this folder is the repository root or a subfolder named werewolf_harness/.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: wh_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/wh_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - uses: astral-sh/setup-uv@v3
      - name: lay out the package
        run: |
          if [ -d werewolf_harness ]; then echo "SRC=$GITHUB_WORKSPACE" >> "$GITHUB_ENV";
          else mkdir -p /tmp/src && ln -s "$GITHUB_WORKSPACE" /tmp/src/werewolf_harness && echo "SRC=/tmp/src" >> "$GITHUB_ENV"; fi
      - name: install
        run: uv pip install --system -r "$SRC/werewolf_harness/pyproject.toml" --extra dev pytest-timeout
      - name: lint
        run: cd "$SRC/werewolf_harness" && ruff check app tests/integration scripts loadtest
      - name: test (core + integration)
        run: cd "$SRC" && python -m pytest werewolf_harness/tests -q --timeout 120

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: build and push
        run: |
          CTX=.; [ -d werewolf_harness ] && CTX=werewolf_harness
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}/werewolf:${GITHUB_SHA::7}
          docker build -f "$CTX/deploy/Dockerfile" -t "$IMG" "$CTX" && docker push "$IMG"

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: rolling restart on the VPS (standby first, then active)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ~/werewolf_harness && git pull --ff-only
            docker compose -f deploy/docker-compose.yml build
            docker compose -f deploy/docker-compose.yml up -d --no-deps worker
            docker compose -f deploy/docker-compose.yml up -d --no-deps api2
            sleep 15
            docker compose -f deploy/docker-compose.yml up -d --no-deps api1
