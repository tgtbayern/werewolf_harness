# One box, everything: two API nodes (active + hot standby), model workers,
# Postgres, Redis, Caddy (HTTPS), Prometheus, Grafana, Jaeger.
#
#   cp .env.example .env   # set JWT_SECRET, DOMAIN and model keys
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Two API nodes are for failover, not sharding: Caddy sends everything to api1
# while /readyz is green; if api1 dies its games' leases expire and api2 adopts
# them (docs/adr/0001). Sharding games across nodes needs game-aware routing at
# the proxy -- see docs/adr/0004.
x-app: &app
  build: {context: .., dockerfile: deploy/Dockerfile}
  env_file: [../.env]
  environment: &appenv
    DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/wh
    REDIS_URL: redis://redis:6379/0
    AGENT_EXECUTOR: streams
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_started}
  restart: unless-stopped
  stop_grace_period: 25s

services:
  api1:
    <<: *app
    environment: {<<: *appenv, NODE_ID: node-1, OTEL_SERVICE_NAME: api-1}
  api2:
    <<: *app
    environment: {<<: *appenv, NODE_ID: node-2, OTEL_SERVICE_NAME: api-2}
  worker:
    <<: *app
    command: ["python", "-m", "werewolf_harness.app.llm.worker"]
    environment: {<<: *appenv, OTEL_SERVICE_NAME: worker, WORKER_METRICS_PORT: "9100"}
    deploy: {replicas: 2}
    healthcheck: {disable: true}

  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}", POSTGRES_DB: wh}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 2s, retries: 30}
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment: {DOMAIN: "${DOMAIN:-localhost}"}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data]
    depends_on: [api1, api2]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer}
    volumes: [./grafana/provisioning:/etc/grafana/provisioning:ro, ./grafana/dashboards:/var/lib/grafana/dashboards:ro]
    ports: ["127.0.0.1:3000:3000"]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["127.0.0.1:16686:16686"]

volumes:
  pgdata:
  redisdata:
  caddydata:
